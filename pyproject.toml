[project]
name = "alpha-one"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PedroPVega", email = "pvegafernan@ensc.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt==2.14.0",
    "starlette>=1.6.0",
]

[tool.uv]
package = false

[project.scripts]
alpha-one = "alpha_one:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
